<svg viewBox="0 0 240 140" xmlns="http://www.w3.org/2000/svg" aria-label="ISPM 15 Fumigation Certification Mark">
  <!-- Outer border -->
  <rect x="5" y="5" width="230" height="130" fill="#FFFFFF" stroke="#0A2540" stroke-width="4.5" rx="6"/>
  
  <!-- Dividing vertical line -->
  <line x1="75" y1="5" x2="75" y2="135" stroke="#0A2540" stroke-width="4.5"/>
  
  <!-- IPPC Wheat Mark on the left -->
  <line x1="38" y1="20" x2="38" y2="120" stroke="#0A2540" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Wheat ears -->
  <path d="M20 40 L38 30 L56 40" fill="none" stroke="#0A2540" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M20 60 L38 50 L56 60" fill="none" stroke="#0A2540" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M20 80 L38 70 L56 80" fill="none" stroke="#0A2540" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Text IPPC -->
  <text x="38" y="106" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="13" fill="#0A2540" letter-spacing="1">IPPC</text>
  
  <!-- Right side: Official ISPM 15 codes for India export -->
  <text x="86" y="44" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="18" fill="#0A2540">IN - GJ - 001</text>
  
  <line x1="75" y1="62" x2="235" y2="62" stroke="#0A2540" stroke-width="2.5"/>
  
  <!-- MB (Methyl Bromide Fumigation code) -->
  <rect x="85" y="74" width="40" height="26" rx="4" fill="#D92525"/>
  <text x="105" y="93" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="16" fill="#FFFFFF">MB</text>
  
  <text x="134" y="86" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="11" fill="#0A2540">FUMIGATION</text>
  <text x="134" y="100" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="9" fill="#056839">ISPM-15 CLEARED</text>
  
  <text x="86" y="122" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="7.5" fill="#666666">TRANSIT PEST TREATMENT</text>
</svg>
